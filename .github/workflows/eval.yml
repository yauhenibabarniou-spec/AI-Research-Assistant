name: Eval

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      - name: Configure Poetry to use Python 3.14
        run: poetry env use $(which python)

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run retrieval eval
        run: PYTHONPATH=${{ github.workspace }} poetry run python scripts/run_retrieval_eval.py --k 3

      - name: Run unit tests
        run: PYTHONPATH=${{ github.workspace }} poetry run pytest tests/test_retrieval_metrics.py -v

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            eval/reports/
            eval/ab_results/
          retention-days: 7
