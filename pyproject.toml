[tool.poetry]
name = "ai-research-assistant"
version = "0.1.0"
description = "AI Research Assistant - RAG-based document search and answer generation"
authors = []
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.14"

fastapi = "^0.128"
uvicorn = { extras = ["standard"], version = "^0.38" }

langchain-core = "^0.3"
langchain-chroma = "^0.2"
langchain-openai = "^0.3"

torch = { version = "~2.9.0", source = "pytorch-cpu" }

chromadb = "^1.0"
pypdf = "^6.0"
python-dotenv = "^1.0"
requests = "^2.32"
sentence-transformers = "^5.0"

[tool.poetry.group.dev.dependencies]
black = "*"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"