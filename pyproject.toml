[tool.poetry]
name = "ai-research-assistant"
version = "0.1.0"
description = "AI Research Assistant - RAG-based document search and answer generation"
authors = []
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.14"

fastapi = "^0.128"
uvicorn = { extras = ["standard"], version = "^0.38" }

langchain-core = "^1.5.6"
langchain-chroma = "^1.1.0"
langchain-openai = "^1.5.2"
langchain-community = "0.4.2"
langchain-huggingface = "^1.2.2"
langchain-ollama = "^1.1.0"

torch = { version = "~2.9.0", source = "pytorch-cpu" }

chromadb = "^1.0"
pypdf = "^6.0"
python-dotenv = "^1.0"
requests = "^2.32"
sentence-transformers = "^5.0"
pydantic-settings = "^2.15.0"

pandas = "^2.0.0"
numpy = ">=2.1.0"
rank-bm25 = "^0.2.2"

[tool.poetry.group.dev.dependencies]
black = "*"
pytest = "^8.0.0"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"